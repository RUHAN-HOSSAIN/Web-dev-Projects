<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailwind Animations</title>

  <link href="./output.css" rel="stylesheet">
</head>
<body class="w-screen h-screen">

    <div class="w-full h-full flex items-center justify-center gap-12">
<!-- 1. Animate-spin -->
        <div class="animate-spin h-8 w-8 border-4 border-blue-500 border-solid rounded-full border-t-blue-200"></div>


<!-- 2. Animate-ping -->
        <span class="relative inline-flex h-4 w-4">
            <span class="absolute h-full w-full rounded-full bg-red-600 opacity-75 animate-ping"></span>
            <span class="relative h-4 w-4 rounded-full bg-red-600"></span>
        </span>

        
<!-- 3. Animate-pulse -->
        <button class="animate-pulse bg-gray-400 text-white font-semibold py-2 px-4 rounded">Submitting...</button>
<!-- 4. Animate-bounce -->
        <div class="animate-bounce text-3xl text-violet-900 flex items-center justify-center bg-gray-100 h-12 w-12 rounded-full">
            ?
        </div>
        

    </div>
</body>
</html>
